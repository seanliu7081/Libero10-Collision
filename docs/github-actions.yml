name: Package and simulator checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    name: Wheel data and static tests (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build source and wheel distributions
        run: |
          python -m pip install build numpy==1.26.4 pytest==9.2.0
          python -m build
          python -m pip install --no-deps dist/*.whl
      - name: Test the installed wheel outside the checkout
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: ''
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/check_installed_wheel.py"
          libero10-collision list
          libero10-collision validate
          python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -q

  simulation:
    name: Pinned LIBERO with CPU OSMesa
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU rendering and benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6 libgl1 libglfw3
          python -m pip install build pytest==9.2.0
          python -m build --wheel
          python -m pip install -c requirements-lock-py310-linux.txt dist/*.whl
      - name: Fetch the pinned public simulator source and assets
        run: libero10-collision setup
      - name: Check the installed wheel and real contact regressions
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/check_installed_wheel.py"
          libero10-collision smoke --task t00 --episode 0 --render-size 128
          python -m pytest "$GITHUB_WORKSPACE/tests" --simulation --import-mode=importlib -q
